<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="./main.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.105/Build/Cesium/Cesium.js"></script>
    <link
      href="https://ajax.googleapis.com/ajax/libs/cesiumjs/1.105/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <!-- Google Fonts for Space-Age Dark Tech UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- deck.gl for premium high-performance geospatial overlays -->
    <script src="https://unpkg.com/deck.gl@~9.0.0/dist.min.js"></script>
    <script src="https://unpkg.com/@loaders.gl/3d-tiles@^4.0.0/dist/dist.min.js"></script>
    <title>3D Spatial Operations Dashboard</title>
  </head>
  <body>
    <main class="main-container">
      <!-- Floating Spatial Operations Control Center -->
      <div class="ops-header-overlay">
        <div class="ops-title-group">
          <span class="pulse-icon-red"></span>
          <h1>SPATIAL OPERATIONS CENTER</h1>
          <span class="system-status-pill">SYS: ACTIVE</span>
        </div>
        <div class="ops-search-box">
          <input type="text" id="place-search-input" placeholder="🔍 Search globally..." autocomplete="off" />
        </div>
        <div class="ops-mode-selector">
          <button class="ops-tab active" id="tab-explorer">🧭 Explorer</button>
          <button class="ops-tab" id="tab-fleet">🚚 Fleet Engine</button>
          <button class="ops-tab" id="tab-indoor">🏢 Oriient Indoor</button>
          <button class="ops-tab" id="tab-bq">📊 BigQuery Analytics</button>
        </div>
      </div>

      <!-- Overlaid Floating Telemetry Panel -->
      <div class="ops-telemetry-panel glass-panel hidden" id="ops-telemetry-panel">
        <!-- Dynamic telemetry cards go here -->
      </div>

      <!-- Floating Glassmorphic Camera Controls Card -->
      <div class="ops-camera-panel glass-panel" id="ops-camera-panel">
        <div class="ops-section-title">🎥 CAMERA CONTROLS</div>
        
        <div class="camera-control-row" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <span class="camera-label" style="margin-bottom: 0; display: inline-block;">🌌 Auto Orbit Mode</span>
          <label class="switch" for="toggle-switch-panel" style="margin: 0;">
            <div class="input-wrapper">
              <input type="checkbox" id="toggle-switch-panel" checked />
              <span class="slider"></span>
            </div>
          </label>
        </div>
        <div class="camera-control-row">
          <label for="orbit-speed-slider" class="camera-label">🔄 Orbit Speed: <span id="orbit-speed-val">1.0</span> RPM</label>
          <input type="range" id="orbit-speed-slider" min="0.1" max="4.0" step="0.1" value="1.0" class="camera-slider" />
        </div>

        <div class="camera-control-row">
          <label for="orbit-radius-slider" class="camera-label">📏 Orbit Radius: <span id="orbit-radius-val">800</span> m</label>
          <input type="range" id="orbit-radius-slider" min="200" max="2500" step="50" value="800" class="camera-slider" />
        </div>

        <div class="camera-control-row">
          <label for="orbit-pitch-slider" class="camera-label">📐 Pitch (Tilt): <span id="orbit-pitch-val">-30</span>°</label>
          <input type="range" id="orbit-pitch-slider" min="-75" max="-15" step="1" value="-30" class="camera-slider" />
        </div>

        <div class="camera-control-row">
          <label for="orbit-style-select" class="camera-label">🌊 Orbit Style</label>
          <select id="orbit-style-select" class="camera-select">
            <option value="fixed-orbit">Fixed (Circular)</option>
            <option value="dynamic-orbit" selected>Dynamic (Sine wave)</option>
          </select>
        </div>
      </div>

      <!-- This section contains a cesium container for displaying 3D map tiles  -->
      <!-- JavaScript is used to manipulate the HTML elements, add event listeners,
        and perform other actions to make the cesium globe interactive and dynamic. -->
      <div id="cesium-container">
        <canvas id="deck-canvas"></canvas>
        <div class="custom-overlay overlay-is-hidden">
          <div class="zoom-control">
            <button
              class="zoom-control-button zoom-in-button"
              aria-label="Zoom in"
            >
              <img src="assets/icons/zoom-control-plus-icon.svg" alt="" />
            </button>
            <button
              class="zoom-control-button zoom-reset-button"
              aria-label="Reset zoom"
            >
              <img src="assets/icons/zoom-control-reset-icon.svg" alt="" />
            </button>
            <button
              class="zoom-control-button zoom-out-button"
              aria-label="Zoom out"
            >
              <img src="assets/icons/zoom-control-minus-icon.svg" alt="" />
            </button>
          </div>
          <div class="auto-orbit-control">
            <label class="switch" for="toggle-switch"
              ><div class="input-wrapper">
                <input type="checkbox" id="toggle-switch" /><span
                  class="slider"
                ></span></div
            ></label>
            <p>Auto Orbit</p>
          </div>
        </div>
        <div class="cesium-attribution-container">
          rendered with
          <a
            class="cesium-logo__link"
            href="https://cesium.com/"
            target="_blank"
            ><img
              class="cesium-logo__image"
              src="assets/cesium-js.png"
              alt="CesiumJS Logo"
          /></a>
        </div>
      </div>

      <!-- The sidebar is used to show information regarding the place details.
      To toggle it, the sidebar-is-open class is added and removed on the main-container -->
      <aside id="sidebar">
        <div class="sidebar-content-wrapper">
          <div class="place-image-container">
            <button class="sidebar-close-button" aria-label="Close Sidebar">
              <img src="assets/icons/sidebar/close-icon.svg" alt="Close" />
            </button>
            <img class="place-image" />
          </div>
          <header class="intro section-container">
            <div class="title-container">
              <h2 class="place-name with-loading-skeleton"></h2>
            </div>
            <div class="rating-overview">
              <div class="rating-overview-number with-loading-skeleton"></div>
              <div class="rating-overview-stars"></div>
              <div class="rating-overview-total"></div>
            </div>
            <div class="place-type with-loading-skeleton"></div>
          </header>
          <div class="place-overview section-container">
            <div class="address">
              <img
                src="assets/icons/sidebar/address-icon.svg"
                alt="address-icon"
              />
              <p class="with-loading-skeleton"></p>
            </div>
            <div class="website">
              <img
                src="assets/icons/sidebar/website-icon.svg"
                alt="website-icon"
              />
              <a class="with-loading-skeleton"></a>
            </div>
            <div class="phone">
              <img src="assets/icons/sidebar/phone-icon.svg" alt="phone-icon" />
              <p class="with-loading-skeleton"></p>
            </div>
            <div class="opening-hours">
              <img
                src="assets/icons/sidebar/opening-hours-icon.svg"
                alt="opening-hours-icon"
              />
              <details>
                <summary
                  class="opening-hours-summary with-loading-skeleton"
                ></summary>
                <div class="opening-hours-details" />
              </details>
            </div>
          </div>
          <div class="reviews-section section-container">
            <h3>Reviews by Google Users</h3>
            <span class="sorting">Most Relevant</span>
            <div class="reviews">
              <div class="reviews-scroll-container"></div>
            </div>
          </div>
        </div>
      </aside>
    </main>
    <!-- Central script to load all javascript files
    to initialize google maps, cesium viewer and dynamically create UI Elements -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
